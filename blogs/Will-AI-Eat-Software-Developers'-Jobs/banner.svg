<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1c"/>
      <stop offset="50%" style="stop-color:#1a1f3c"/>
      <stop offset="100%" style="stop-color:#0d1224"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6ef3ff"/>
      <stop offset="100%" style="stop-color:#ff6ec7"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6ec7"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6ef3ff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>
  
  <!-- Glowing orbs -->
  <circle cx="150" cy="150" r="100" fill="#6ef3ff" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1050" cy="480" r="120" fill="#ff6ec7" opacity="0.15" filter="url(#glow)"/>
  <circle cx="600" cy="315" r="80" fill="#a78bfa" opacity="0.1" filter="url(#glow)"/>
  
  <!-- Code brackets -->
  <text x="80" y="350" font-family="monospace" font-size="180" fill="#6ef3ff" opacity="0.15" font-weight="bold">{</text>
  <text x="1000" y="350" font-family="monospace" font-size="180" fill="#ff6ec7" opacity="0.15" font-weight="bold">}</text>
  
  <!-- Robot head -->
  <g transform="translate(480, 80)">
    <rect x="60" y="20" width="120" height="100" rx="20" fill="#1a1f3c" stroke="#6ef3ff" stroke-width="2"/>
    <circle cx="95" cy="55" r="15" fill="#6ef3ff" filter="url(#glow)"/>
    <circle cx="145" cy="55" r="15" fill="#ff6ec7" filter="url(#glow)"/>
    <rect x="85" y="90" width="70" height="10" rx="5" fill="#a78bfa"/>
    <line x1="120" y1="20" x2="120" y2="0" stroke="#6ef3ff" stroke-width="3"/>
    <circle cx="120" cy="-5" r="10" fill="#6ef3ff" filter="url(#glow)"/>
  </g>
  
  <!-- Human silhouette -->
  <g transform="translate(720, 100)">
    <circle cx="40" cy="30" r="25" fill="#1a1f3c" stroke="#ff6ec7" stroke-width="2"/>
    <path d="M 15 60 Q 40 80 65 60 L 65 120 L 15 120 Z" fill="#1a1f3c" stroke="#ff6ec7" stroke-width="2"/>
  </g>
  
  <!-- Connection line between AI and Human -->
  <path d="M 620 150 Q 680 180 720 150" stroke="url(#accent1)" stroke-width="2" fill="none" stroke-dasharray="8,4" opacity="0.6"/>
  
  <!-- Main Title -->
  <text x="600" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="56" fill="white" text-anchor="middle" font-weight="700">
    Will AI Eat Software
  </text>
  <text x="600" y="370" font-family="'Segoe UI', Arial, sans-serif" font-size="56" fill="url(#accent1)" text-anchor="middle" font-weight="700">
    Developers' Jobs?
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">
    The honest truth every developer needs to hear in 2026
  </text>
  
  <!-- Decorative line -->
  <rect x="350" y="480" width="500" height="3" rx="1.5" fill="url(#accent1)" opacity="0.5"/>
  
  <!-- Author -->
  <text x="600" y="550" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#6ef3ff" text-anchor="middle" font-weight="500">
    Renish Batada
  </text>
  <text x="600" y="575" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    renishbatada.com
  </text>
</svg>
